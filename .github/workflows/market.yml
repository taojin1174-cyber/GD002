name: market

# 每天北京时间 08:19 核查一次；GitHub 定时任务可能延迟。
on:
  schedule:
    - cron: "19 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 验证分类与解析
        run: node --test market.test.mjs
      - name: 采集公开挂牌报价
        run: node market-fetch.mjs
      - name: 保存数据
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add market.json market-history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: 更新行情跳动公开报价"
          # 其他频道可能同时更新；重放本次数据提交，不覆盖远端页面改动。
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
