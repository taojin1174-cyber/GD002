name: update
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install feedparser googlenewsdecoder "selectolax<1" && python fetch.py
      - run: |
          git config user.name "bot" && git config user.email "bot@users.noreply.github.com"
          git add data.json archive.json links.json
          git diff --cached --quiet || (git commit -m "update data" && git pull --rebase && git push)
