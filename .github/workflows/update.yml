name: update

# GitHub 的 schedule 会被大量丢弃（实测每小时只跑到 1/3 左右），
# 同一小时内排 3 个时间点，至少有一个能落地；跑得比这更密没有意义。
on:
  schedule:
    - cron: "7 * * * *"
    - cron: "27 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集（单个频道失败不影响其他频道）
        run: |
          task() {
            local name="$1"; shift
            echo "::group::$name"
            if timeout -k 10 420 "$@"; then
              echo "✅ $name"
            else
              echo "::warning::$name 本次失败，已跳过（其他频道不受影响）"
            fi
            echo "::endgroup::"
          }
          task "食品榜单" python fetch.py
          task "原料专题" python extra.py
          task "火爆分类" python queue.py
          task "AI 频道" python ai.py
          task "重点来源" python focus.py
          task "经济频道" python eco.py
          task "军事频道" python mil.py

      # 清洗是纯本地逻辑，失败说明有真 bug：宁可这次不发布，也不发布脏数据
      - name: 清洗 · 去重 · 压缩
        run: python clean.py

      - name: 数据概览
        run: |
          python - <<'PY' > /tmp/summary.md
          import json
          print("| 频道 | 榜单数 | 条目数 | 更新时间 |")
          print("|---|---|---|---|")
          for name, f in [("食品", "data.json"), ("AI", "ai.json"), ("经济", "eco.json"), ("军事", "mil.json")]:
              try:
                  d = json.load(open(f, encoding="utf-8"))
                  b = d.get("boards", [])
                  print(f"| {name} | {len(b)} | {sum(len(x.get('items', [])) for x in b)} | {d.get('updated', '-')[:16].replace('T', ' ')} |")
              except Exception as e:
                  print(f"| {name} | - | 读取失败: {e} | - |")
          PY
          cat /tmp/summary.md
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 提交数据
        run: |
          FILES="data.json archive.json links.json archive2.json links2.json links3.json links4.json links5.json links6.json links7.json queue_archive.json ai.json eco.json mil.json meta.json translate_cache.json highlights.json"
          # 这些缓存文件可能还不存在，先建空对象，避免每轮翻译/要点都从零开始（有 API key 时才真正产生成本）
          [ -f translate_cache.json ] || echo '{}' > translate_cache.json
          [ -f highlights.json ] || echo '{}' > highlights.json
          for f in $FILES; do [ -f "$f" ] || touch "$f"; done

          mkdir -p /tmp/snap && cp $FILES /tmp/snap/
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --hard --quiet origin/main
            cp /tmp/snap/* .
            git add $FILES
            if git diff --cached --quiet; then
              echo "数据没有变化，跳过提交"
              exit 0
            fi
            git -c user.name="bot" -c user.email="bot@users.noreply.github.com" \
              commit --quiet -m "data: $(date '+%Y-%m-%d %H:%M')"
            if git push --quiet; then
              echo "已提交并推送"
              exit 0
            fi
            echo "第 $attempt 次推送失败，10 秒后重试"
            sleep 10
          done
          echo "::error::连续 3 次推送失败"
          exit 1

      # 静默失败最致命：连续好几天不更新也不会有人发现
      - name: 失败告警
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="[自动] update 工作流失败，站点可能已停止更新"
          n=$(gh issue list --state open --search "in:title update 工作流失败" --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$n" = "0" ]; then
            gh issue create --title "$TITLE" \
              --body "运行 #${{ github.run_number }} 失败：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          站点数据可能已停止更新，请查看上面的日志并修复。修好后关掉这个 issue 即可。" || true
          else
            echo "已有未关闭的告警 issue，不再重复创建"
          fi
