name: update
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
permissions: { contents: write }
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install feedparser googlenewsdecoder "selectolax<1" && python fetch.py
      - run: |
          git config user.name "bot" && git config user.email "bot@users.noreply.github.com"
          touch links.json
          for i in 1 2 3; do
            cp data.json archive.json links.json /tmp/
            git fetch origin main && git reset --hard origin/main
            cp /tmp/data.json /tmp/archive.json /tmp/links.json .
            git add data.json archive.json links.json
            git diff --cached --quiet && break
            git commit -m "update data" && git push && break
            sleep 5
          done
