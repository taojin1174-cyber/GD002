<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>食品热榜 · 预制菜观察</title>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#1c2420;--mute:#6d7872;--line:#dfe5e0;--acc:#b8341f;--chip:#e8eee9}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141a17;--card:#1d2521;--ink:#e6ece8;--mute:#8d9993;--line:#2b3630;--acc:#f0735c;--chip:#26312b}}
:root[data-theme=dark]{--bg:#141a17;--card:#1d2521;--ink:#e6ece8;--mute:#8d9993;--line:#2b3630;--acc:#f0735c;--chip:#26312b}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.row{max-width:1280px;margin:auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
h1{font-size:18px;margin:0;font-weight:700}h1 b{color:var(--acc)}
nav{display:flex;gap:4px;flex-wrap:wrap}
button,input{font:inherit;color:inherit}
nav button{border:0;background:none;padding:4px 12px;border-radius:14px;cursor:pointer;color:var(--mute)}
nav button.on{background:var(--acc);color:#fff}
input{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:4px 12px;width:180px}
.sp{flex:1}#upd{color:var(--mute);font-size:12px}
#theme{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:2px 10px;cursor:pointer}
main{max-width:1280px;margin:auto;padding:14px 16px 40px}
#topics{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
#topics span{color:var(--mute);margin-right:4px}
.chip{border:0;background:var(--chip);border-radius:12px;padding:1px 10px;cursor:pointer;font-size:13px}
.chip i{font-style:normal;color:var(--acc);margin-left:4px}
#grid{columns:300px;column-gap:14px}
.card{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}
.card h2{margin:0;padding:10px 14px;font-size:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.card h2 small{color:var(--mute);font-weight:400}
ol{list-style:none;margin:0;padding:4px 0}
li{display:flex;gap:8px;padding:6px 14px}li:hover{background:var(--chip)}
li em{font-style:normal;width:16px;flex:none;color:var(--mute);text-align:right}li:nth-child(-n+3) em{color:var(--acc);font-weight:700}
a{color:inherit;text-decoration:none}a:hover{color:var(--acc)}
li a small{display:block;color:var(--mute);font-size:12px}
.empty{color:var(--mute);padding:40px 0;text-align:center}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px}.top .card{margin:0;flex:1 1 320px}
.dg{padding:8px 14px 10px}.dg p{margin:0 0 4px;color:var(--mute)}
.st{border:0;background:none;cursor:pointer;color:var(--line);font-size:15px;padding:0 0 0 4px;flex:none;align-self:flex-start}.st.on{color:var(--acc)}
.tr{padding:6px 10px 10px}.tr svg{width:100%;height:auto}.lg{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--mute);padding:0 6px}.lg b{display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle}
</style></head><body>
<header><div class="row">
<h1>食品热榜<b>·</b>预制菜观察</h1>
<nav id="tabs"></nav><span class="sp"></span>
<input id="q" type="search" placeholder="搜索标题或来源"><span id="upd"></span>
<button id="theme" title="切换日夜模式">◐</button>
</div></header>
<main><div id="top" class="top"></div><div id="grid"></div></main>
<script>
let D=null,cat="全部",kw="";const $=s=>document.querySelector(s);
const ago=t=>{if(!t)return"";const m=(Date.now()/1e3-t)/60;return m<60?Math.max(1,~~m)+"分钟前":m<1440?~~(m/60)+"小时前":~~(m/1440)+"天前"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const FK="food-hot-fav",fav=()=>{try{return JSON.parse(localStorage.getItem(FK)||"[]")}catch(e){return[]}};
const setFav=a=>{try{localStorage.setItem(FK,JSON.stringify(a))}catch(e){}};
const li=(i,n,f)=>`<li><em>${n}</em><a href="${esc(i.u)}" target="_blank" rel="noopener">${esc(i.t)}<small>${esc(i.s||"")} ${ago(i.ts)}</small></a><button class="st${f.has(i.u)?" on":""}" data-u="${esc(i.u)}" title="收藏 / 取消收藏">★</button></li>`;
const card=(name,tag,items,f)=>`<section class="card"><h2>${esc(name)}<small>${tag}</small></h2><ol>${items.map((i,n)=>li(i,n+1,f)).join("")}</ol></section>`;
function digest(){const g=D.digest;if(!g)return"";
  const l=a=>a.map(i=>`<li><em>•</em><a href="${esc(i.u)}" target="_blank" rel="noopener">${esc(i.t)}</a></li>`).join("");
  return`<section class="card"><h2>预制菜日报 ${g.date}<button class="chip" id="cp">复制日报</button></h2><div class="dg"><p>${esc(g.summary)}</p></div><ol>${l(g.head)}</ol><h2 style="border-top:1px solid var(--line)">政策动向</h2><ol>${l(g.pol)||"<li>暂无</li>"}</ol></section>`}
function trend(){const T=D.trend,ks=T?Object.keys(T.series):[];if(!ks.length)return"";
  const W=560,H=170,p=30,C=["#b8341f","#2a7f62","#c98a12","#3a63b8","#8a4fb0","#6d7872"],n=T.weeks.length;
  const mx=Math.max(1,...ks.flatMap(k=>T.series[k])),x=i=>p+i*(W-2*p)/(n-1),y=v=>H-p-v/mx*(H-2*p);
  const g=ks.map((k,j)=>{const v=T.series[k];return`<polyline fill="none" stroke="${C[j]}" stroke-width="2" points="${v.map((a,i)=>x(i)+","+y(a)).join(" ")}"/>`+v.map((a,i)=>`<circle cx="${x(i)}" cy="${y(a)}" r="2.5" fill="${C[j]}"><title>${k} ${T.weeks[i]}：${a}</title></circle>`).join("")}).join("");
  const xs=T.weeks.map((w,i)=>`<text x="${x(i)}" y="${H-8}" font-size="10" text-anchor="middle" fill="currentColor" opacity=".6">${w}</text>`).join("");
  return`<section class="card"><h2>话题周趋势<small>每周被提及次数</small></h2><div class="tr"><svg viewBox="0 0 ${W} ${H}"><line x1="${p}" x2="${W-p}" y1="${H-p}" y2="${H-p}" stroke="currentColor" opacity=".2"/>${g}${xs}</svg><div class="lg">${ks.map((k,j)=>`<span><b style="background:${C[j]}"></b>${k}</span>`).join("")}</div><div class="lg" style="margin-top:4px">数据每天累积，运行几周后趋势会更清晰</div></div></section>`}
function render(){
  const f=new Set(fav().map(i=>i.u));
  if(!D){$("#grid").innerHTML='<p class="empty">还没有数据：请先在 GitHub Actions 里手动运行一次 update。</p>';return}
  const cats=["全部",...new Set(D.boards.map(b=>b.cat)),"收藏"];
  $("#tabs").innerHTML=cats.map(c=>`<button class="${c==cat?"on":""}" data-c="${c}">${c}</button>`).join("");
  $("#upd").textContent="更新于 "+ago(Date.parse(D.updated)/1e3);
  const k=kw.trim().toLowerCase(),ok=i=>!k||((i.t||"")+(i.s||"")).toLowerCase().includes(k);
  $("#top").innerHTML=(!k&&(cat=="全部"||cat=="预制菜"))?digest()+trend():"";
  let html;
  if(cat=="收藏"){const a=fav().filter(ok);html=a.length?card("我的收藏","保存在本浏览器",a,f):'<p class="empty">还没有收藏。点文章右侧的 ★ 就能收藏。</p>'}
  else html=D.boards.filter(b=>cat=="全部"||b.cat==cat).map(b=>{const it=b.items.filter(ok);return it.length?card(b.name,b.cat,it,f):""}).join("");
  $("#grid").innerHTML=html||'<p class="empty">没有匹配的内容，换个关键词试试。</p>';
}
async function load(){try{const f=(new URLSearchParams(location.search).get("d")||"data").replace(/[^a-z0-9]/gi,"");D=await(await fetch(f+".json?"+Date.now())).json();if(D.title){document.title=D.title;document.querySelector("h1").textContent=D.title}}catch(e){D=null}render()}
document.addEventListener("click",e=>{
  const c=e.target.dataset.c;if(c){cat=c;render();return}
  if(e.target.id=="cp"){navigator.clipboard.writeText(D.digest.text);e.target.textContent="已复制";return}
  const u=e.target.dataset.u;if(u){let a=fav();if(a.some(i=>i.u==u))a=a.filter(i=>i.u!=u);else{const it=D.boards.flatMap(b=>b.items).find(i=>i.u==u);if(it)a.push(it)}setFav(a);render()}});
$("#q").oninput=e=>{kw=e.target.value;render()};
$("#theme").onclick=()=>{const r=document.documentElement,d=matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=(r.dataset.theme||(d?"dark":"light"))=="dark"?"light":"dark"};
load();setInterval(load,5*60*1000);
</script></body></html>
