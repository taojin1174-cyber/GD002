<script>
"use strict";
const $=s=>document.querySelector(s);
const CH={food:{f:"data",t:"预制菜 · 食品热点观察"},ai:{f:"ai",t:"AI 动态 · 全球观察"},eco:{f:"eco",t:"经济 · 政策与宏观"},mil:{f:"mil",t:"军事 · 动态观察"}};
const QQ=(location.search.match(/[?&]d=([^&]*)/)||[])[1]||"";
const cur=CH[QQ]?QQ:"food";
const FK="food-hot-fav",EK="theme";
let D=null,cat="全部",kw="",sig="";

/* ---------- 工具 ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^https?:\/\//i.test(u||"")||/^\//.test(u||"")?u:"#";
const ago=t=>{if(!t)return"";const m=(Date.now()/1e3-t)/60;if(m<1)return"刚刚";return m<60?Math.floor(m)+"分钟前":m<1440?Math.floor(m/60)+"小时前":Math.floor(m/1440)+"天前"};
const nk=t=>{const s=String(t||"").replace(/[^\p{L}\p{N}]+/gu,"").toLowerCase();let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)};
function msg(t){const e=$("#msg");if(!t)return e.classList.remove("on");e.textContent=t;e.classList.add("on");clearTimeout(msg.t);msg.t=setTimeout(()=>e.classList.remove("on"),4200)}

/* ---------- 收藏（以标题指纹为 key，链接解码后不会丢） ---------- */
let FAV=(function(){try{const a=JSON.parse(localStorage.getItem(FK)||"[]");return Array.isArray(a)?a.filter(x=>x&&x.t).map(x=>({t:x.t,u:x.u,s:x.s||"",ts:x.ts||0,k:x.k||nk(x.t)})):[]}catch(e){return[]}})();
const favSave=()=>{try{localStorage.setItem(FK,JSON.stringify(FAV))}catch(e){}};
const favSet=()=>new Set(FAV.map(i=>i.k));
(function(){try{const raw=localStorage.getItem(FK);if(raw&&!raw.includes('"k"'))favSave()}catch(e){}})();

/* ---------- 删除（隐藏）+ 日志：按标题指纹记录，只保存在本浏览器 ---------- */
const HK="hot-hide";
const hideList=()=>{try{const a=JSON.parse(localStorage.getItem(HK)||"[]");return Array.isArray(a)?a.filter(x=>x&&(x.t||x.k)):[]}catch(e){return[]}};
const setHide=a=>{try{localStorage.setItem(HK,JSON.stringify(a))}catch(e){}};
let HS=new Set();
const loadHide=()=>{HS=new Set(hideList().map(x=>x.k||nk(x.t)))};loadHide();
const vis=i=>!HS.has(nk(i.t));
function hideItem(k){
  let it=null,bd="",ct="";
  for(const b of (D?D.boards:[])){const f=(b.items||[]).find(i=>nk(i.t)===k);if(f){it=f;bd=b.name;ct=b.cat;break}}
  if(!it)it=FAV.find(i=>i.k===k)||{t:"",u:"",s:""};
  const a=hideList();
  a.push({t:it.t||"",s:it.s||"",u:it.u||"",ch:cur,cat:ct,board:bd,k:k,at:new Date().toISOString()});
  setHide(a);loadHide();render(true);msg("已删除，可点右上角 🗑 恢复或导出日志");
}

/* ---------- 点击记录：记下你点开过哪些文章，只保存在本浏览器 ---------- */
const CK="hot-click";
const clickList=()=>{try{const a=JSON.parse(localStorage.getItem(CK)||"[]");return Array.isArray(a)?a:[]}catch(e){return[]}};
function trackClick(k){
  let it=null,bd="",ct="";
  for(const b of (D?D.boards:[])){const f=(b.items||[]).find(i=>nk(i.t)===k);if(f){it=f;bd=b.name;ct=b.cat;break}}
  if(!it)return;
  const a=clickList();
  a.push({t:it.t,s:it.s||"",u:it.u||"",ch:cur,cat:ct,board:bd,k:k,at:new Date().toISOString()});
  try{localStorage.setItem(CK,JSON.stringify(a.slice(-2000)))}catch(e){}
}
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a[data-n]");if(a)trackClick(a.dataset.n)},true);
document.addEventListener("auxclick",e=>{if(e.button===1){const a=e.target.closest&&e.target.closest("a[data-n]");if(a)trackClick(a.dataset.n)}},true);

/* ---------- 展开状态：每次进入/切换频道都默认折叠，只在本页会话内有效 ---------- */
let EXP=new Set();
function expSave(){}

/* ---------- 渲染 ---------- */
const N=8;
const row=(i,n,f)=>{const k=nk(i.t),th=i.img?`<img class="th" src="${esc(safe(i.img))}" alt="" width="46" height="46" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">`:"";return `<li><em>${n}</em><a class="it" data-n="${k}" href="${esc(safe(i.u))}" target="_blank" rel="noopener noreferrer"${i.d?` title="${esc(i.d)}"`:""}>${th}<span class="tx">${esc(i.t)}<small data-ts="${i.ts||0}" data-src="${esc(i.s||"")}">${esc(i.s||"")}${i.ts?" · "+ago(i.ts):""}</small></span></a><button class="st${f.has(k)?" on":""}" data-k="${k}" aria-label="收藏 ${esc(i.t).slice(0,40)}" aria-pressed="${f.has(k)}">★</button><button class="dl" data-h="${k}" aria-label="删除这条" title="删除这条（记入日志）">✕</button></li>`};
function card(key,name,tag,items,f){
  const open=EXP.has(key),show=open?items:items.slice(0,N);
  const more=items.length>N?`<button class="more" data-x="${esc(key)}">${open?"收起":`展开全部 ${items.length} 条`}</button>`:"";
  return `<section class="card" data-key="${esc(key)}"><h2>${esc(name)}<small>${esc(tag)}</small></h2><ol>${show.map((i,n)=>row(i,n+1,f)).join("")}</ol>${more}</section>`;
}
function digest(){
  const g=D.digest;if(!g||!g.head)return"";
  const l=a=>(a||[]).filter(vis).map(i=>`<li><em>•</em><a href="${esc(safe(i.u))}" target="_blank" rel="noopener noreferrer">${esc(i.t)}</a></li>`).join("");
  return `<section class="card"><h2>预制菜日报 ${esc(g.date)}<button class="chip" id="cp">复制日报</button></h2><div class="dg"><p>${esc(g.summary)}</p></div><ol>${l(g.head)}</ol>${g.pol&&g.pol.length?`<h2 style="border-top:1px solid var(--line)">政策动向</h2><ol>${l(g.pol)}</ol>`:""}</section>`;
}
const TC=["#b8341f","#2a7f62","#c98a12","#3a63b8","#8a4fb0","#6d7872"];
function tchart(labels,series,opt){
  const o=opt||{},ks=Object.keys(series||{}),n=(labels||[]).length;
  if(!ks.length||n<2)return"";
  const W=560,H=o.h||160,p=28,base=H-20;
  const mx=Math.max(1,...ks.flatMap(k=>series[k]));
  const x=i=>p+i*(W-2*p)/(n-1),y=v=>base-v/mx*(base-12),skip=n>10?2:1;
  const g=ks.map((k,j)=>{
    const arr=series[k],co=TC[j%6];
    const ln=`<polyline fill="none" stroke="${co}" stroke-width="${o.thin?1.6:2}" stroke-linejoin="round" points="${arr.map((a,i)=>x(i)+","+y(a)).join(" ")}"/>`;
    const dots=arr.map((a,i)=>{const last=!!o.hollow&&i===n-1;
      return `<circle cx="${x(i)}" cy="${y(a)}" r="${last?3.6:2.4}" fill="${last?"var(--card)":co}" stroke="${co}" stroke-width="${last?2:0}"><title>${esc(k)} ${labels[i]}：${a}</title></circle>`}).join("");
    return ln+dots;
  }).join("");
  const guide=o.hollow?`<line x1="${x(n-1)}" x2="${x(n-1)}" y1="10" y2="${base}" stroke="currentColor" stroke-dasharray="3 3" opacity=".3"/>`:"";
  const xs=labels.map((w,i)=>(i%skip===0||i===n-1)?`<text x="${x(i)}" y="${H-5}" font-size="10" text-anchor="middle" fill="currentColor" opacity=".55">${esc(w)}</text>`:"").join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.alt||"趋势图")}"><line x1="${p}" x2="${W-p}" y1="${base}" y2="${base}" stroke="currentColor" opacity=".18"/>${guide}${g}${xs}</svg>`;
}
function trend(){
  const T=D&&D.trend;if(!T||!T.series)return"";
  const ks0=Object.keys(T.series||{});
  let wl=(T.weeks||[]).slice(),ws={};ks0.forEach(k=>ws[k]=(T.series[k]||[]).slice());
  let cut=0;
  while(cut<wl.length-1&&ks0.every(k=>!ws[k][cut]))cut++;
  if(cut>0){wl=wl.slice(cut);ks0.forEach(k=>ws[k]=ws[k].slice(cut))}
  const hasW=ks0.length>0&&wl.length>=2;
  const dk=T.daily?Object.keys(T.daily):[];
  const hasD=!!(T.days&&T.days.length>=2&&dk.length);
  if(!hasW&&!hasD)return"";
  const lg=arr=>arr.map((k,j)=>`<span><b style="background:${TC[j%6]}"></b>${esc(k)}</span>`).join("");
  let h=`<section class="card"><h2>话题趋势<small>被提及次数</small></h2><div class="tr">`;
  if(hasW){
    h+=tchart(wl,ws,{hollow:true,alt:"话题周趋势"});
    h+=`<div class="lg">${lg(ks0)}</div>`;
    h+=`<div class="lg" style="margin-top:2px">近 ${wl.length} 周 · 最右一列是本周，还在增长</div>`;
  }
  if(hasD){
    h+=`<h2 style="border-top:1px solid var(--line);margin-top:12px">近 14 天<small>每天被提及次数</small></h2>`;
    h+=tchart(T.days,T.daily,{h:140,thin:true,alt:"话题日趋势"});
    h+=`<div class="lg">${lg(dk)}</div>`;
  }else if(hasW){
    h+=`<div class="lg" style="margin-top:8px;opacity:.7">日趋势：新版抓取脚本跑一次后出现</div>`;
  }
  h+=`</div></section>`;
  return h;
}
function paint(){
  const hn=$("#hn");if(hn)hn.textContent=hideList().length;
  if(!D){$("#grid").innerHTML='<p class="empty">没有拿到数据。请检查网络后重试，或在 GitHub Actions 里手动运行一次 update。</p>';return}
  const f=favSet();
  const cats=["全部",...new Set(D.boards.map(b=>b.cat)),"收藏"];
  if(!cats.includes(cat))cat="全部";
  $("#tabs").innerHTML=cats.map(c=>`<button class="${c===cat?"on":""}" data-c="${esc(c)}" ${c===cat?'aria-current="true"':""}>${esc(c)}</button>`).join("");
  const k=kw.trim().toLowerCase(),ok=i=>!k||((i.t||"")+(i.s||"")).toLowerCase().includes(k);
  const brief=Date.parse(D.updated||"");
  $("#upd").textContent=isNaN(brief)?"":"更新于 "+ago(brief/1e3);
  $("#top").innerHTML=!k&&(cat==="全部"||cat==="预制菜")?trend()+digest():"";
  let html="";
  if(cat==="收藏"){
    const a=FAV.filter(ok);
    html=a.length?card("fav","我的收藏","★ 保存在本浏览器",[...a].sort((x,y)=>(y.ts||0)-(x.ts||0)),f):'<p class="empty">还没有收藏。点文章右侧的 ★ 就能收藏。</p>';
  }else{
    html=D.boards.filter(b=>cat==="全部"||b.cat===cat).map(b=>{
      const it=(b.items||[]).filter(i=>ok(i)&&vis(i));
      if(!it.length)return"";
      const tag=(b.cat===b.name?"":b.cat+" · ")+it.length+" 条";
      return card(b.cat+"|"+b.name,b.name,tag,it,f);
    }).join("");
  }
  $("#grid").innerHTML=html||'<p class="empty">没有匹配的内容，换个关键词试试。</p>';
  sig=[D.updated,cat,kw,[...EXP].sort().join(","),FAV.length].join("|");
}
function render(force){
  if(!force&&D&&sig===[D.updated,cat,kw,[...EXP].sort().join(","),FAV.length].join("|"))return;
  const y=window.scrollY;
  paint();
  if(y)window.scrollTo(0,y);
}

/* ---------- 数据 ---------- */
function meta(){
  const t=(D&&D.title)||CH[cur].t;
  document.title=t;
  $("#chan").textContent=t;
  document.querySelectorAll(".ch").forEach(a=>{const on=a.dataset.d===cur;a.classList.toggle("on",on);if(on)a.setAttribute("aria-current","page")});
  const m=document.querySelector('meta[name=description]');
  if(m&&D&&D.boards){const n=D.boards.reduce((s,b)=>s+(b.items||[]).length,0);m.content=t+"：共 "+n+" 条聚合资讯，每小时自动更新。";}
}
async function load(first){
  try{
    const r=await fetch(CH[cur].f+".json",{cache:"no-cache"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json();
    if(!d||!Array.isArray(d.boards))throw new Error("数据格式异常");
    if(D&&d.updated===D.updated)return;
    D=d;meta();render(true);
  }catch(e){
    console.error("数据加载失败",e);
    if(!D)paint();
    msg("数据加载失败，5 分钟后自动重试");
  }
}

/* ---------- 交互 ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-c],[data-k],[data-x],[data-h],#cp,#up");

  if(t.id==="up")return void window.scrollTo({top:0,behavior:"smooth"});
  if(t.id==="cp"){if(D.digest&&D.digest.text)navigator.clipboard.writeText(D.digest.text).then(()=>{t.textContent="已复制";setTimeout(()=>{t.textContent="复制日报"},1500)}).catch(()=>msg("复制失败，请手动选择"));return}
  if(t.dataset.h){hideItem(t.dataset.h);return}
  if(t.dataset.c){cat=t.dataset.c;render();return}
  if(t.dataset.x){const k=t.dataset.x;const el=document.querySelector(`[data-key="${CSS.escape(k)}"]`);const y=el?el.getBoundingClientRect().top:0;EXP.has(k)?EXP.delete(k):EXP.add(k);expSave();paint();const el2=document.querySelector(`[data-key="${CSS.escape(k)}"]`);if(el2)window.scrollBy(0,el2.getBoundingClientRect().top-y);sig="";return}
  const k=t.dataset.k;if(k){const on=favSet().has(k);if(on)FAV=FAV.filter(i=>i.k!==k);else{const it=D.boards.flatMap(b=>b.items||[]).find(i=>nk(i.t)===k);if(it)FAV.unshift({t:it.t,u:it.u,s:it.s||"",ts:it.ts||0,k})}favSave();render(true)}
});
let qt;
$("#q").addEventListener("input",e=>{clearTimeout(qt);const v=e.target.value;qt=setTimeout(()=>{kw=v;render()},150)});
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==$("#q")){e.preventDefault();$("#q").focus()}
  if(e.key==="Escape"&&document.activeElement===$("#q")){$("#q").value="";kw="";$("#q").blur();render()}
});
$("#theme").onclick=()=>{
  const r=document.documentElement,cur2=r.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  const nx=cur2==="dark"?"light":"dark";r.dataset.theme=nx;
  try{localStorage.setItem(EK,nx)}catch(e){}
  const tc=document.querySelector('meta[name=theme-color]');
  if(tc)tc.setAttribute("content",nx==="dark"?"#141a17":"#f3f5f2");
};
addEventListener("scroll",()=>{$("#up").classList.toggle("on",scrollY>700)},{passive:true});

/* 相对时间每分钟就地刷新，不再整页重绘 */
setInterval(()=>{document.querySelectorAll("small[data-ts]").forEach(el=>{const ts=+el.dataset.ts;if(!ts)return;el.textContent=(el.dataset.src?el.dataset.src+" · ":"")+ago(ts)})},60000);

/* 5 分钟自动刷新：页面隐藏时不跑，回到前台立刻补一次 */
setInterval(()=>{if(document.visibilityState==="visible")load()},5*60*1000);

load(true);
